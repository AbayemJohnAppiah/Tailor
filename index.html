<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleek 'N' Casual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="icon" href="images/icon/icon.png">
  <script defer src="home.js"></script>
  <script defer src="header.js"></script>
  <script defer src="gallery.js"></script>
  <script defer src="footer.js"></script>
</head>

<body>

  <header>
    <div class="img-container" id="img-container"></div>

    <nav id="nav"></nav>

    <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>

    <section id="display" class="display">

      <div class="image-overlay"></div>

      <div class="track" id="track"></div>

      <div class="text-track" id="text-track"></div>

      <div class="name" id="name"></div>

    </section>

    <section class="cards-section">
      <div class="stack" id="stack">
        <div class="card c1" id="c1"></div>
        <div class="card c2" id="c2"></div>
        <div class="card c3" id="c3"></div>
      </div>

      <div class="right-side">

        <div id="the-move-up-text">
        </div>


        <!-- NEW: Tele block -->
        <div class='card-tele moveup' id="card-tele"></div>

      </div>



    </section>

    <section class="services-container" id="services-container">
      <div class="our-services" id="our-services"></div>
      <div class="services-text">
        <div class="card1" id="card1"></div>
        <div class="card1" id="card2"></div>
        <div class="card1" id="card3"></div>
        <div class="card1" id="card4"></div>
        <div class="card1" id="card5"></div>
      </div>
    </section>

    <section class="about-container" id="about">

      <div class="about-image-container" id="about-image-containe"></div>

      <div class="about-text-container reveal">

        <div class="about-text" id="about-text"></div>

        <div class="quote-panel" id="quote-panel"></div>

      </div>

    </section>

  </main>

  <footer id="contact" class="footer-container">

    <div class="contact-container">

      <div class="brand-name-logo" id="brand-name-logo"></div>

      <div class="contact-details" id="contact-details"></div>

    </div>

    <hr style="color: #ff00ff;">

    <div class="footer-bottom" id="footer-bottom"></div>

  </footer>

</body>

</html>
